<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 专题回溯</title>
  <style>
    body{font:16px/1.65 system-ui,sans-serif;color:#263238;background:#f5f7fa;margin:0}
    main{max-width:980px;margin:30px auto;padding:20px}a{color:#1565c0}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;padding:8px}
    article{background:white;border:1px solid #dce3e9;border-radius:10px;padding:20px;margin:16px 0;overflow-wrap:anywhere}
    h2{font-size:1.1rem;margin:0 0 10px}.meta,#status,#scope{color:#52616b;font-size:.9rem}
    blockquote{border-left:3px solid #90caf9;padding-left:12px;margin-left:0;white-space:pre-wrap}
    button:disabled{opacity:.4}#papers[aria-busy=true]{opacity:.5}
    @media(prefers-color-scheme:dark){body{background:#182027;color:#e1e7ed}article{background:#25323c;border-color:#405361}a{color:#90caf9}.meta,#status,#scope{color:#bdccd6}}
  </style>
  <script src="../../../app/long-range-reader.js" defer></script>
</head>
<body><main>
  <a href="../../../#/long-range/README">← 回溯结果列表</a>
  <h1>arXiv 专题回溯</h1>
  <p id="scope"></p>
  <div class="controls">
    <label>专题 <select id="topic" aria-label="专题"></select></label>
    <label>分类 <select id="bucket" aria-label="结果分类"><option value="core">核心（≥8分且证据通过）</option><option value="related">补充（6–7分）</option><option value="review">待复核</option><option value="excluded">低相关（≤5分）</option></select></label>
  </div>
  <p id="status" role="status">正在读取结果…</p>
  <div class="controls"><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button><button id="retry" type="button" hidden>重试</button></div>
  <section id="papers" aria-label="论文结果"></section>
</main></body></html>
